name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl3 cmake

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Package
        run: |
          cd build
          # Remove symlinks and extra bloat from the bundle for distribution
          rm -rf kopi.app/Contents/MacOS/_deps
          # Create dmg
          hdiutil create -volname kopi -srcfolder kopi.app -ov -format UDZO kopi.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopi-macos-arm64
          path: build/kopi.dmg

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl3-dev \
              libx11-dev libxtst-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          cd build
          tar czf kopi-linux.tar.gz kopi
          sha256sum kopi-linux.tar.gz > kopi-linux.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopi-linux
          path: build/kopi-linux.tar.gz*

  release:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kopi.dmg
            dist/kopi-linux.tar.gz
            dist/kopi-linux.tar.gz.sha256
          body: "See [README.md](https://github.com/sanchosiesta/kopi/blob/main/README.md) for full documentation."
